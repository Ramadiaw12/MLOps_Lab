# Nginx : site statique + reverse proxy vers l'API Flask (service "api" du réseau Docker)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques du frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tout ce qui commence par /api/ est transmis au conteneur Flask (port 5000)
    # Exemple : http://127.0.0.1:8501/api/predict  →  http://api:5000/predict
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
